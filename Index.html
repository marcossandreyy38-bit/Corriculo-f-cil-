<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Currículo Fácil</title>

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    padding:20px;
}

.container{
    background:white;
    max-width:500px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
}

button{
    width:100%;
    padding:10px;
}

#resultado{
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">
    <h1>Currículo Fácil</h1>

    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="text" id="exp" placeholder="Experiência">

    <button onclick="gerar()">Gerar Currículo</button>

    <div id="resultado"></div>
</div>

<script>
function gerar(){
    let nome = document.getElementById("nome").value;
    let telefone = document.getElementById("telefone").value;
    let exp = document.getElementById("exp").value;

    document.getElementById("resultado").innerHTML = `
        <h2>${nome}</h2>
        <p><b>Telefone:</b> ${telefone}</p>
        <p><b>Experiência:</b> ${exp}</p>
    `;
}
</script>

</body>
</html>
